<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>問卷載入中...</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f8fafc; color: #334155; }
    .spinner { width: 36px; height: 36px; border: 4px solid #e2e8f0; border-top: 4px solid #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
  <script>
    (function() {
      // 設定各組網址與對應權重（總和 = 100）
      const weightedSurveys = [
        { url: "https://tinggingliao.github.io/consumer-study/part3_upcoming_preview_90.html", weight: 33 }, // 預告高運費 (目前15份 -> 33%)
        { url: "https://tinggingliao.github.io/consumer-study/part3_upcoming_preview_45.html", weight: 25 }, // 預告低運費 (目前19份 -> 25%)
        { url: "https://tinggingliao.github.io/consumer-study/part3_flash_today_90.html",      weight: 25 }, // 限時高運費 (目前19份 -> 25%)
        { url: "https://tinggingliao.github.io/consumer-study/part3_flash_today_45.html",      weight: 17 }  // 限時低運費 (目前24份 -> 17%)
      ];

      // 依權重隨機抽取網址的函式
      function getWeightedRandomUrl() {
        const totalWeight = weightedSurveys.reduce((sum, item) => sum + item.weight, 0);
        let randomNum = Math.random() * totalWeight;
        
        for (let i = 0; i < weightedSurveys.length; i++) {
          if (randomNum < weightedSurveys[i].weight) {
            return weightedSurveys[i].url;
          }
          randomNum -= weightedSurveys[i].weight;
        }
        return weightedSurveys[0].url;
      }

      const validUrls = weightedSurveys.map(item => item.url);
      const STORAGE_KEY = "assigned_survey_site_C";
      let targetUrl = null;

      try {
        targetUrl = localStorage.getItem(STORAGE_KEY);
        if (!targetUrl || !validUrls.includes(targetUrl)) {
          targetUrl = getWeightedRandomUrl();
          localStorage.setItem(STORAGE_KEY, targetUrl);
        }
      } catch (e) {
        targetUrl = getWeightedRandomUrl();
      }

      if (targetUrl) {
        window.location.replace(targetUrl);
      }
    })();
  </script>
</head>
<body>
  <div class="spinner"></div>
  <p>正在為您載入問卷，請稍候...</p>
</body>
</html>
