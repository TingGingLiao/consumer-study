<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>商品選購評估</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

  <!-- ==================== 0. 最前置系統指導語遮罩 (z-[100]，進站前強制閱讀) ==================== -->
  <div id="instruction-overlay" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-[100] flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 md:p-8 shadow-2xl border border-slate-200 text-center relative">
      
      <!-- 系統圖示 -->
      <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl shadow-inner border border-blue-100">
        📋
      </div>

      <!-- 放大後的學術情境標籤 (主標題) -->
      <div class="inline-block bg-blue-100 text-blue-800 text-sm md:text-base px-4 py-1.5 rounded-full font-bold tracking-wider mb-6">
        學術研究情境模擬指引
      </div>
      
      <!-- 說明文案區塊 (自然流暢版) -->
      <div class="bg-slate-50 border border-slate-200 rounded-2xl p-5 text-left text-xs md:text-sm text-gray-700 leading-relaxed mb-6 space-y-3.5">
        <p class="flex items-start gap-2.5">
          <span class="text-blue-600 font-bold">1.</span>
          <span><strong>情境模擬說明：</strong>本網站僅供學術問卷情境測量設計，全程<strong>無任何實質金錢扣款或交易行為</strong>。</span>
        </p>
        <p class="flex items-start gap-2.5">
          <span class="text-blue-600 font-bold">2.</span>
          <span><strong>瀏覽方式：</strong>請依照您平時的網購習慣，放鬆瀏覽頁面中的商品規格、促銷活動與價格方案即可。</span>
        </p>
        <p class="flex items-start gap-2.5">
          <span class="text-blue-600 font-bold">3.</span>
          <span><strong>填答指引：</strong>瀏覽完畢後，請依循頁面按鈕指引前往問卷，繼續完成後續評估填答。</span>
        </p>
      </div>

      <!-- 確認進入按鈕 -->
      <button type="button" id="enter-site-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl text-base shadow-lg transition active:scale-[0.99] cursor-pointer">
        我已理解說明，進入網站
      </button>
    </div>
  </div>

  <!-- ==================== 1. 頂部常駐學術聲明列 (深藍底 + 橙黃色文字凸顯) ==================== -->
  <div class="relative z-[70] bg-slate-900 border-b border-slate-700 text-slate-100 text-xs md:text-sm py-2 px-4 shadow-md flex items-center justify-center gap-2 text-center">
    <span>📋</span>
    <p class="leading-relaxed font-normal tracking-wide">
      <span class="text-amber-400 font-bold">【學術研究聲明】</span>本情境僅供學術問卷評估使用，全程不會產生任何實質金錢扣款或交易行為。
    </p>
  </div>

  <!-- ==================== 2. 進場行銷促銷彈窗 (z-50) ==================== -->
  <div id="promo-modal" class="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 md:p-8 shadow-2xl relative text-center border-t-8 border-amber-500">
      <button type="button" id="close-promo-x" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold p-1 cursor-pointer">✕</button>
      
      <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl font-bold shadow-inner">
        ⚡
      </div>
      
      <span class="bg-red-600 text-white text-xs px-2.5 py-1 rounded-full font-bold
