<!-- 1. 進場彈窗：突發性限時快閃（含即時動態倒數計時） -->
  <div id="promo-modal" class="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 md:p-8 shadow-2xl relative text-center border-t-8 border-amber-500">
      <button type="button" onclick="closePromoModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold p-1">✕</button>
      <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl font-bold shadow-inner">
        ⚡
      </div>
      
      <span class="bg-red-600 text-white text-xs px-2.5 py-1 rounded-full font-bold uppercase tracking-wider">限時特惠倒數中</span>
      <h2 class="text-2xl font-black text-gray-900 mt-2 mb-2">⚡ 突發快閃・僅限今日特惠</h2>
      
      <!-- 動態倒數計時器區塊 -->
      <div class="bg-amber-50 border border-amber-200 rounded-2xl p-3 my-4">
        <p class="text-xs text-amber-800 font-bold mb-1.5">距活動結束僅剩：</p>
        <div class="flex justify-center items-center gap-2 text-white font-mono font-black text-lg">
          <span id="cd-hours" class="bg-gray-900 px-2.5 py-1 rounded-lg">02</span>
          <span class="text-gray-900 font-sans">:</span>
          <span id="cd-minutes" class="bg-gray-900 px-2.5 py-1 rounded-lg">45</span>
          <span class="text-gray-900 font-sans">:</span>
          <span id="cd-seconds" class="bg-red-600 px-2.5 py-1 rounded-lg animate-pulse">18</span>
        </div>
      </div>

      <p class="text-xs text-gray-600 mb-6 leading-relaxed">
        年度爆款行動電源限時破盤下殺！特惠僅限今日下單，倒數歸零即刻恢復原價！
      </p>
      
      <button type="button" onclick="closePromoModal()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3.5 rounded-xl shadow-lg transition">
        立即進入搶購 (今日限定價)
      </button>
    </div>
  </div>
