<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>情境模擬載入中...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f8fafc;
      color: #334155;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <script>
    (function() {
      // Part 2（明暗折扣 X 運費）四組實驗情境網址
      const salient_90 = "https://tinggingliao.github.io/consumer-study/part2_salient_90.html"; // 21 份 (缺 9 份，主力衝刺)
      const salient_45 = "https://tinggingliao.github.io/consumer-study/part2_salient_45.html"; // 26 份 (缺 4 份)
      const obscure_90 = "https://tinggingliao.github.io/consumer-study/part2_obscure_90.html"; // 26 份 (缺 4 份)
      const obscure_45 = "https://tinggingliao.github.io/consumer-study/part2_obscure_45.html"; // 29 份 (缺 1 份)

      // 🎯 精準補齊池 (總權重 10)：
      // salient_90 出現 5 次 (50%)
      // salient_45 出現 2 次 (20%)
      // obscure_90 出現 2 次 (20%)
      // obscure_45 出現 1 次 (10%)
      const targetPool = [
        salient_90, 
        salient_45, salient_45, salient_45,
        obscure_90, 
        obscure_45, obscure_45, obscure_45
      ];

      // 隨機抽取目標網址並直接跳轉
      const randomIndex = Math.floor(Math.random() * targetPool.length);
      const targetUrl = targetPool[randomIndex];

      if (targetUrl) {
        window.location.replace(targetUrl);
      }
    })();
  </script>
</head>
<body>
  <div class="spinner"></div>
  <p>正在為您載入問卷情境，請稍候...</p>
</body>
</html>
