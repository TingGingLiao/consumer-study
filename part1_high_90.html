<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>商品選購評估</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">
  <header class="bg-white border-b h-14 flex items-center px-4 max-w-5xl mx-auto w-full justify-between">
    <span class="text-xl font-bold text-blue-600">SMART TECH</span>
    <span class="text-xs text-gray-400">官方線上旗艦館</span>
  </header>
  <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8 grid md:grid-cols-2 gap-8">
      <div class="aspect-square bg-gray-100 rounded-xl overflow-hidden">
        <img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12?auto=format&fit=crop&w=800&q=80" class="object-cover w-full h-full">
      </div>
      <div class="flex flex-col justify-between">
        <div>
          <span class="bg-red-50 text-red-600 text-xs px-2.5 py-0.5 rounded font-bold">促銷中</span>
          <h1 class="text-2xl font-bold text-gray-900 mt-2 mb-2">ProTech 旗艦級全方位智慧手錶 (GPS+心率)</h1>
          <p class="text-sm text-gray-500 mb-4">藍寶石玻璃鏡面、航海級金屬外殼、支援全天候精準健康監測。</p>
          <div class="bg-gray-50 p-4 rounded-xl mb-4 border">
            <div class="flex items-baseline space-x-3">
              <span class="text-3xl font-extrabold text-red-600">NT$ 3,840</span>
              <span class="text-sm text-gray-400 line-through">原價 NT$ 4,800</span>
            </div>
            <p class="text-xs text-red-500 mt-1">★ 專屬折抵 NT$ 960</p>
          </div>
          <div class="border-t border-b py-3 text-sm flex justify-between">
            <span class="text-gray-500">物流運費</span>
            <span class="font-bold text-gray-800">標準物流運費 NT$ 90</span>
          </div>
        </div>
        <button id="checkout-btn" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl shadow-lg mt-6">
          確認選購並前往結帳 (總額 NT$ 3,930)
        </button>
      </div>
    </div>
  </main>
  <script>
    const startTime = Date.now();
    document.getElementById('checkout-btn').addEventListener('click', () => {
      const duration = ((Date.now() - startTime) / 1000).toFixed(2);
      alert(`選購評估完成！\n運費：NT$ 90\n決策時間：${duration} 秒\n即將導回問卷。`);
    });
  </script>
</body>
</html>
