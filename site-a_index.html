<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>問卷載入中...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f8fafc;
      color: #334155;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <script>
    (function() {
      // 4 個實驗情境網站網址
      const site1 = "https://tinggingliao.github.io/consumer-study/part1_high_90.html";
      const site2 = "https://tinggingliao.github.io/consumer-study/part1_high_45.html";
      const site3 = "https://tinggingliao.github.io/consumer-study/part1_low_90.html";
      const site4 = "https://tinggingliao.github.io/consumer-study/part1_low_45.html"; // 對應 4kmwB 問卷

      // 🌟 加權分派池：site4 出現 4 次，其餘各 1 次（被抽中機率約 57.1%）
      const weightedSurveys = [
        site1,
        site2,
        site3,
        site4, site4, site4, site4
      ];

      // 隨機抽取目標網址並直接跳轉
      const randomIndex = Math.floor(Math.random() * weightedSurveys.length);
      const targetUrl = weightedSurveys[randomIndex];

      if (targetUrl) {
        window.location.replace(targetUrl);
      }
    })();
  </script>
</head>
<body>
  <div class="spinner"></div>
  <p>正在為您載入問卷情境，請稍候...</p>
</body>
</html>
