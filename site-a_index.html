<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>情境模擬網頁載入中...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f8fafc;
      color: #334155;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <script>
    (function() {
      // 實驗情境網站網址
      const low_90  = "https://tinggingliao.github.io/consumer-study/part1_low_90.html";  // 高運費低單價 (缺 4 份)
      const high_45 = "https://tinggingliao.github.io/consumer-study/part1_high_45.html"; // 低運費高單價 (缺 2 份)
      const low_45  = "https://tinggingliao.github.io/consumer-study/part1_low_45.html";  // 低單價低運費 (額外多收)

      // 🎯 分派權重池 (總權重 5)：
      // low_90  出現 2 次 (40%)
      // low_45  出現 2 次 (40%)
      // high_45 出現 1 次 (20%)
      const targetPool = [
        low_90, low_90, low_90,
        low_45, 
        high_45
      ];

      // 隨機抽取目標網址並直接跳轉
      const randomIndex = Math.floor(Math.random() * targetPool.length);
      const targetUrl = targetPool[randomIndex];

      if (targetUrl) {
        window.location.replace(targetUrl);
      }
    })();
  </script>
</head>
<body>
  <div class="spinner"></div>
  <p>正在為您載入問卷情境，請稍候...</p>
</body>
</html>
